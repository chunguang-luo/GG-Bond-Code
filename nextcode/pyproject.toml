[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextcode"
version = "0.3.0"
description = "NextCode — AI-powered CLI assistant"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "anthropic>=0.40.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.scripts]
nextcode = "next_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/next_code"]
